services:
  - type: web
    name: true-one-bank-bridge
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: DATABASE_PATH
        value: /var/data/enquiries.sqlite3
    disk:
      name: enquiries-data
      mountPath: /var/data
      sizeGB: 1
